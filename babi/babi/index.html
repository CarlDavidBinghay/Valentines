<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute Valentine's Day page to ask someone to be your Valentine!">
  <meta name="theme-color" content="#ffd0e5">
  <title>Valentine's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .gradient-background {
      background: linear-gradient(180deg, #ffd0e5 0%, #ffe8f2 36%, #ffffff 100%);
      min-height: 100vh;
    }

    .bounce {
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    .no-button-container {
      position: relative;
      height: 48px;
      width: 80px;
    }

    .moving-no-button {
      position: absolute;
      top: 0;
      left: 0;
      transition: all 0.3s ease;
    }

    .heart-pulse {
      animation: heartPulse 1.5s infinite;
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .floating-hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.7;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .container-border {
      border: 3px solid #ff7eb3;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 126, 179, 0.2);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
    }

    .glow {
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
    }
  </style>
  <!-- Preload images so transitions feel instant -->
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbG1yYjE3bzN5eHR3ZXhkaGd0Z21xM3VlZ3lhN3lpMmxzcnp1dnluMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26tknCqiJrBQG6DrC/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGlpM3YxdmZ4Y3RyaXVvZXNjY2N2aWQ5Z2d6M2p0NW9vczRmbmJtbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0MYt5jPR6QX5pnqM/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnU2Z2RvbWtkZXdtZ2YxZzExYmtoZ2k2eW1sMmY5eTRxZG5tM2JtNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26tknCqiJrBQG6DrC/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F1MjZ0YWE5MzI3eWt0cnRtaDZ1ajFqdG56M2Z0c2ZvYzFvYmw0dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7abld5hQvUqHfN72/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExeHBzOHVlMnZvMWp0bG9rcWJjM3doMGF2NXE3YjVob3FsdzFwamVmbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0MYt5jPR6QX5pnqM/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHFmZjJhYjZ0aHF2eGgwd2R4enQ4ZXN1M2oyMW9qbm9yM3Q2eWFlMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7abld5hQvUqHfN72/giphy.gif">
  <link rel="preload" as="image" href="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExenlpOWl4aXJpdm5rZmJvaDN1a2syYWhsYzN6cDl5aWNrOXc3eXdpNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0MYt5jPR6QX5pnqM/giphy.gif">
</head>
<body class="gradient-background">
  <!-- Floating hearts background -->
  <div class="floating-hearts" id="floatingHearts"></div>
  
  <main class="flex items-center justify-center h-screen p-4">
    <section class="flex flex-col items-center p-8 container-border max-w-lg w-full relative z-10">
      <img
        id="imageDisplay"
        alt="Cute kitten with flowers"
        class="rounded-md h-[300px] w-full object-cover heart-pulse"
        src="images/outside.jpg"
      />
      <h1 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-6 text-center">
        Will you be my Valentine?
      </h1>
      <div id="responseButtons" class="flex gap-6 pt-2 items-center justify-center w-full">
        <button
          id="yesButton"
          class="bounce glow inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-medium cursor-pointer px-8 py-3 bg-gradient-to-r from-pink-500 to-red-500 text-white transition-all duration-300 ease-in-out hover:from-pink-600 hover:to-red-600 hover:scale-105 min-h-12 min-w-[100px]"
        >
          Yes 💖
        </button>
        <div class="no-button-container" id="noButtonContainer">
          <button
            id="noButton"
            class="moving-no-button inline-flex items-center justify-center whitespace-nowrap rounded-full text-xl font-medium cursor-pointer px-4 py-2 bg-gradient-to-r from-gray-300 to-gray-400 text-gray-800 transition-all duration-300 hover:from-gray-400 hover:to-gray-500 h-12 w-[80px]"
          >
            No
          </button>
        </div>
      </div>
      <p id="counterMessage" class="text-pink-500 mt-4 text-sm opacity-0 transition-opacity duration-300">Just click Yes already! ❤️</p>
    </section>
  </main>

  <script>
    (() => {
      // DOM references
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const noButtonContainer = document.getElementById('noButtonContainer');
      const imageDisplay = document.getElementById('imageDisplay');
      const valentineQuestion = document.getElementById('valentineQuestion');
      const responseButtons = document.getElementById('responseButtons');
      const counterMessage = document.getElementById('counterMessage');
      const floatingHearts = document.getElementById('floatingHearts');

      // Configuration
      const GROWTH_PER_CLICK = 35;
      const FONT_GROWTH_PER_CLICK = 25;
      const MAX_NO_CLICKS = 5;
      
      // No button movement parameters
      const MOVEMENT_RADIUS = 150; // How far the button can move
      const MOVE_ON_HOVER = true; // Whether button moves on hover
      const MOVE_ON_APPROACH = true; // Whether button moves when cursor gets close

      const IMAGE_PATHS = [
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbG1yYjE3bzN5eHR3ZXhkaGd0Z21xM3VlZ3lhN3lpMmxzcnp1dnluMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26tknCqiJrBQG6DrC/giphy.gif',
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGlpM3YxdmZ4Y3RyaXVvZXNjY2N2aWQ5Z2d6M2p0NW9vczRmbmJtbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0MYt5jPR6QX5pnqM/giphy.gif',
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnU2Z2RvbWtkZXdtZ2YxZzExYmtoZ2k2eW1sMmY5eTRxZG5tM2JtNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26tknCqiJrBQG6DrC/giphy.gif',
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F1MjZ0YWE5MzI3eWt0cnRtaDZ1ajFqdG56M2Z0c2ZvYzFvYmw0dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7abld5hQvUqHfN72/giphy.gif',
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExeHBzOHVlMnZvMWp0bG9rcWJjM3doMGF2NXE3YjVob3FsdzFwamVmbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0MYt5jPR6QX5pnqM/giphy.gif',
        'https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHFmZjJhYjZ0aHF2eGgwd2R4enQ4ZXN1M2oyMW9qbm9yM3Q2eWFlMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7abld5hQvUqHfN72/giphy.gif',
        'images/inside.jpg',
      ];



      const NO_BUTTON_MESSAGES = [
        'No',
        'Are you sure?',
        'Pookie please',
        "Don't do this to me :(",
        "You're breaking my heart",
        "I'm gonna cry...",
      ];

      const ALT_TEXTS = [
        'Cute kitten with flowers',
        'Sad kitten looking up',
        'Kitten begging',
        'Heartbroken kitten',
        'Crying kitten',
        'Devastated kitten',
        'Happy kitten celebrating',
      ];

      // State
      let noClickCount = 0;
      let buttonHeight = 48;
      let buttonWidth = 80;
      let fontSize = 16;
      let isMoving = false;
      let moveTimeout = null;

      // Create floating hearts
      function createFloatingHearts() {
        const heartCount = 15;
        for (let i = 0; i < heartCount; i++) {
          const heart = document.createElement('div');
          heart.classList.add('floating-heart');
          heart.innerHTML = '❤️';
          heart.style.left = `${Math.random() * 100}%`;
          heart.style.animationDelay = `${Math.random() * 5}s`;
          heart.style.fontSize = `${Math.random() * 15 + 15}px`;
          floatingHearts.appendChild(heart);
        }
      }

      // Move the No button to a random position within container
      function moveNoButton() {
        if (noClickCount >= MAX_NO_CLICKS) return;
        
        const containerRect = noButtonContainer.getBoundingClientRect();
        const buttonRect = noButton.getBoundingClientRect();
        
        // Calculate random position within container bounds
        const maxX = containerRect.width - buttonRect.width;
        const maxY = containerRect.height - buttonRect.height;
        
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;
        
        // Apply new position
        noButton.style.left = `${randomX}px`;
        noButton.style.top = `${randomY}px`;
        
        // Add a little rotation for fun
        noButton.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
        
        // Show counter message after a few attempts
        if (noClickCount > 1) {
          counterMessage.style.opacity = '1';
        }
      }

      // Move button when cursor approaches
      function checkCursorProximity(e) {
        if (!MOVE_ON_APPROACH || noClickCount >= MAX_NO_CLICKS || isMoving) return;
        
        const buttonRect = noButton.getBoundingClientRect();
        const cursorX = e.clientX;
        const cursorY = e.clientY;
        
        // Calculate distance between cursor and button center
        const buttonCenterX = buttonRect.left + buttonRect.width / 2;
        const buttonCenterY = buttonRect.top + buttonRect.height / 2;
        const distance = Math.sqrt(
          Math.pow(cursorX - buttonCenterX, 2) + 
          Math.pow(cursorY - buttonCenterY, 2)
        );
        
        // If cursor is within 100px of button, move it
        if (distance < 100) {
          moveNoButton();
          isMoving = true;
          
          // Prevent moving again for a short time
          clearTimeout(moveTimeout);
          moveTimeout = setTimeout(() => {
            isMoving = false;
          }, 300);
        }
      }

      // Initialize
      createFloatingHearts();

      // Event Listeners
      noButton.addEventListener('click', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;

        noClickCount++;

        // Update image and alt text
        imageDisplay.src = IMAGE_PATHS[noClickCount];
        imageDisplay.alt = ALT_TEXTS[noClickCount];

        // Grow the "Yes" button to make it harder to ignore
        buttonHeight += GROWTH_PER_CLICK;
        buttonWidth += GROWTH_PER_CLICK;
        fontSize += FONT_GROWTH_PER_CLICK;

        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;

        // Update "No" button text with increasingly desperate messages
        noButton.textContent = NO_BUTTON_MESSAGES[noClickCount];
        
        // Move the button after click
        moveNoButton();
        
        // Make button harder to catch as attempts increase
        if (noClickCount >= 3) {
          noButton.style.transition = 'all 0.2s ease';
        }
      });

      // Move button on hover if enabled
      if (MOVE_ON_HOVER) {
        noButton.addEventListener('mouseenter', () => {
          if (noClickCount >= MAX_NO_CLICKS) return;
          moveNoButton();
        });
      }

      // Track cursor movement for proximity detection
      document.addEventListener('mousemove', checkCursorProximity);

      // Also move button if user tries to tab to it
      noButton.addEventListener('focus', () => {
        if (noClickCount >= MAX_NO_CLICKS) return;
        moveNoButton();
      });

      yesButton.addEventListener('click', () => {
        imageDisplay.src = IMAGE_PATHS[IMAGE_PATHS.length - 1];
        imageDisplay.alt = ALT_TEXTS[ALT_TEXTS.length - 1];
        imageDisplay.classList.remove('heart-pulse');
        imageDisplay.classList.add('glow');
        valentineQuestion.textContent = 'Yayyy!! I love you! 💖';
        responseButtons.style.display = 'none';
        counterMessage.textContent = 'Miss youuu babiii! ❤️❤️❤️';
        counterMessage.style.opacity = '1';
        counterMessage.style.fontSize = '1.2rem';
        counterMessage.style.fontWeight = 'bold';

        // Stop the button from moving
        noButtonContainer.style.display = 'none';
        
        // Remove cursor tracking
        document.removeEventListener('mousemove', checkCursorProximity);

        // Heart-shaped confetti for a valentine theme
        const heart = confetti.shapeFromPath({
          path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
        });

        const defaults = { 
          spread: 360, 
          ticks: 100, 
          gravity: 0.5, 
          decay: 0.94, 
          startVelocity: 30, 
          shapes: [heart], 
          colors: ['#ff69b4', '#ff1493', '#ff6b81', '#e84393', '#fd79a8'] 
        };

        // Multiple confetti bursts
        confetti({ ...defaults, particleCount: 80, scalar: 1.5 });
        
        setTimeout(() => {
          confetti({ ...defaults, particleCount: 60, scalar: 1.2, origin: { x: 0.2, y: 0.5 } });
          confetti({ ...defaults, particleCount: 60, scalar: 1.2, origin: { x: 0.8, y: 0.5 } });
        }, 150);
        
        setTimeout(() => {
          confetti({ ...defaults, particleCount: 100, scalar: 1, gravity: 0.3 });
        }, 300);
        
        // Continuous confetti for a few seconds
        const end = Date.now() + 3000;
        const frame = () => {
          confetti({
            ...defaults,
            particleCount: 10,
            scalar: 0.8,
            origin: { x: Math.random(), y: Math.random() * 0.5 }
          });
          
          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        };
        frame();
      });

      // Initial button movement after a short delay
      setTimeout(() => {
        moveNoButton();
      }, 1000);
    })();
  </script>
</body>
</html>
